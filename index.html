<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyMiner - اسکای ماینر</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }

        /* صفحه لودینگ اختصاصی دقیقاً مشابه نمونه مد نظر شما */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #090e17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s ease;
        }
        .splash-container {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }
        .splash-logo {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }
        .spinner-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #00d2ff;
            border-right: 5px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            z-index: 1;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .splash-title {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .splash-subtitle {
            font-size: 13px;
            color: #00d2ff;
            opacity: 0.9;
        }

        /* بخش‌های اصلی بازی */
        .header { margin-top: 5px; width: 100%; }
        h2 { margin: 5px 0; font-size: 20px; color: #00d2ff; font-weight: bold; }
        .user-greeting { font-size: 13px; color: #00ffcc; margin-bottom: 5px; }
        
        .score-container { margin: 5px 0; }
        h1 { font-size: 48px; color: #ffd700; margin: 0; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        
        .page { display: none; width: 100%; flex: 1; flex-direction: column; align-items: center; justify-content: center; }
        .page.active { display: flex; }

        .coin-box { position: relative; margin: 15px auto; }
        .coin {
            width: 170px;
            height: 170px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 0 35px rgba(0, 210, 255, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.4);
            transition: transform 0.05s ease;
            overflow: hidden;
            border: 4px solid #ffd700;
        }
        .coin img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .coin:active { transform: scale(0.92); }

        .energy-container {
            width: 85%;
            max-width: 280px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background: #111;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00ffcc, #00d2ff);
            transition: width 0.1s linear;
        }
        .energy-text { font-size: 12px; color: #b0e0e6; margin-top: 4px; }

        .stats {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 15px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 320px;
            margin: 10px 0;
            display: flex;
            justify-content: space-around;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .stat-item span { display: block; font-size: 16px; color: #ffd700; font-weight: bold; margin-top: 3px; }
        .stat-item label { font-size: 11px; color: #ddd; }

        .upgrade-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 12px;
            padding: 12px 15px;
            margin: 8px 0;
            width: 90%;
            max-width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .upgrade-info { text-align: right; }
        .upgrade-info h4 { margin: 0 0 5px 0; font-size: 14px; color: #ffd700; }
        .upgrade-info p { margin: 0; font-size: 11px; color: #ccc; }
        .upgrade-btn {
            background: linear-gradient(135deg, #ffd700, #ff8f00);
            border: none;
            color: #111;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.4);
            width: 100%;
            padding: 10px 0;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
            margin-top: 10px;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-btn.active { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }

        .floating-num {
            position: absolute;
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
        }
    </style>
</head>
<body>

    <!-- صفحه لودینگ با حلقه چرخان و متن اتصال دقیق -->
    <div id="splash-screen">
        <div class="splash-container">
            <div class="spinner-ring"></div>
            <img src="coin1.png" alt="SkyMiner Logo" class="splash-logo">
        </div>
        <div class="splash-title">SkyMiner</div>
        <div class="splash-subtitle">...Connecting to the SkyMiner network</div>
    </div>

    <div class="header">
        <h2>⚡ SKYMINER MINING</h2>
        <div class="user-greeting" id="usernameDisplay">در حال بارگذاری بازی...</div>
    </div>

    <!-- صفحه اول: معدن و کلیک -->
    <div id="page-game" class="page active">
        <div class="score-container">
            <p style="color: #ddd; margin: 0; font-size: 12px;">موجودی کل سکه‌ها:</p>
            <h1 id="score">0</h1>
        </div>
        
        <div class="coin-box">
            <div class="coin" id="coin" onclick="incrementScore(event)">
                <img src="coin1.png" alt="Coin">
            </div>
        </div>

        <!-- نوار انرژی -->
        <div class="energy-container">
            <div class="energy-bar-bg">
                <div class="energy-bar-fill" id="energyFill"></div>
            </div>
            <div class="energy-text"><span id="energyText">1000</span> / 1000 انرژی</div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <label>سود هر کلیک</label>
                <span id="perClickDisplay">1</span>
            </div>
            <div class="stat-item">
                <label>سطح</label>
                <span id="level">1</span>
            </div>
        </div>
    </div>

    <!-- صفحه دوم: فروشگاه ارتقاء -->
    <div id="page-shop" class="page">
        <h3 style="color: #00d2ff; margin-bottom: 15px;">🛒 فروشگاه ارتقاء</h3>
        <div class="upgrade-card">
            <div class="upgrade-info">
                <h4>معدن‌کاری پیشرفته (+1 کلیک)</h4>
                <p>قیمت: <span id="upgradePrice">50</span> سکه</p>
            </div>
            <button class="upgrade-btn" onclick="buyUpgrade()">خرید</button>
        </div>
    </div>

    <!-- منوی پایین صفحه -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchPage('game', this)">⛏️ معدن</button>
        <button class="nav-btn" onclick="switchPage('shop', this)">🛒 ارتقاء</button>
    </div>

    <script>
        // نمایش صفحه لودینگ به مدت دقیق ۳ ثانیه (۳۰۰۰ میلی‌ثانیه)
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if(splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 600);
            }
        }, 3000);

        const SUPABASE_URL = 'https://flogzyhropeajugvlshy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tf_veYsAmwHeuN0njONEPQ_oqSwupYp';
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) { console.error(e); }

        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user 
            ? tg.initDataUnsafe.user 
            : { id: 'guest_' + Math.floor(Math.random() * 100000), username: 'کاربر مهمان' };

        const telegramId = String(user.id);
        const username = user.username || user.first_name || 'بازیکن';
        document.getElementById('usernameDisplay').innerText = `سلام، ${username}! 👋`;

        let score = parseInt(localStorage.getItem('game_score')) || 0;
        let clickPower = parseInt(localStorage.getItem('click_power')) || 1;
        let upgradeCost = parseInt(localStorage.getItem('upgrade_cost')) || 50;
        let energy = 1000;
        const maxEnergy = 1000;

        document.getElementById('score').innerText = score;
        document.getElementById('perClickDisplay').innerText = clickPower;
        document.getElementById('upgradePrice').innerText = upgradeCost;

        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 5);
                updateEnergyUI();
            }
        }, 1000);

        function updateEnergyUI() {
            document.getElementById('energyText').innerText = energy;
            const percent = (energy / maxEnergy) * 100;
            document.getElementById('energyFill').style.width = percent + '%';
        }

        function incrementScore(event) {
            if (energy <= 0) {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            score += clickPower;
            energy -= 1;
            
            document.getElementById('score').innerText = score;
            updateEnergyUI();
            
            localStorage.setItem('game_score', score);

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            showFloatingNumber(event, '+' + clickPower);
            saveToCloud();
        }

        function buyUpgrade() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                clickPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.8);

                document.getElementById('score').innerText = score;
                document.getElementById('perClickDisplay').innerText = clickPower;
                document.getElementById('upgradePrice').innerText = upgradeCost;

                localStorage.setItem('game_score', score);
                localStorage.setItem('click_power', clickPower);
                localStorage.setItem('upgrade_cost', upgradeCost);

                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                alert('ارتقاء با موفقیت انجام شد!');
                saveToCloud();
            } else {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                alert('سکه‌های شما برای خرید این ارتقاء کافی نیست!');
            }
        }

        function switchPage(pageName, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById('page-' + pageName).classList.add('active');
            btn.classList.add('active');
        }

        function showFloatingNumber(event, text) {
            const coinBox = document.querySelector('.coin-box');
            const num = document.createElement('div');
            num.className = 'floating-num';
            num.innerText = text;
            
            const rect = coinBox.getBoundingClientRect();
            const x = event.clientX - rect.left - 15;
            const y = event.clientY - rect.top - 15;
            
            num.style.left = x + 'px';
            num.style.top = y + 'px';
            
            coinBox.appendChild(num);
            setTimeout(() => { num.remove(); }, 600);
        }

        async function saveToCloud() {
            if (!supabaseClient) return;
            try {
                await supabaseClient
                    .from('users')
                    .update({ score: score })
                    .eq('telegram_id', telegramId);
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
