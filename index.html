<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyMiner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .header { margin-top: 10px; }
        h2 { margin: 5px 0; font-size: 22px; color: #00d2ff; font-weight: bold; letter-spacing: 1px; }
        .user-greeting { font-size: 14px; color: #00ffcc; margin-bottom: 5px; }
        .score-container { margin: 10px 0; }
        h1 { font-size: 55px; color: #ffd700; margin: 0; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        .coin-box { position: relative; margin: 20px auto; }
        .coin {
            width: 180px;
            height: 180px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 0 45px rgba(0, 210, 255, 0.5), inset 0 0 20px rgba(255, 215, 0, 0.4);
            transition: transform 0.05s ease;
            overflow: hidden;
            border: 4px solid #ffd700;
        }
        .coin img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .coin:active { transform: scale(0.92); }
        .stats {
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            width: 85%;
            max-width: 300px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .stat-item span { display: block; font-size: 18px; color: #ffd700; font-weight: bold; margin-top: 5px; }
        .stat-item label { font-size: 12px; color: #ddd; }
        .status-sync { font-size: 11px; color: #b0e0e6; margin-top: -10px; }
        .floating-num {
            position: absolute;
            color: #00ffcc;
            font-size: 26px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚡ SKYMINER MINING</h2>
        <div class="user-greeting" id="usernameDisplay">در حال بارگذاری بازی...</div>
    </div>

    <div class="score-container">
        <p style="color: #ddd; margin: 0; font-size: 13px;">موجودی کل سکه‌ها:</p>
        <h1 id="score">0</h1>
    </div>
    
    <div class="coin-box">
        <div class="coin" id="coin" onclick="incrementScore(event)">
            <!-- فایل عکس شما که دقیقاً از کنار index.html خوانده می‌شود -->
            <img src="coin.png" alt="Coin">
        </div>
    </div>

    <div class="status-sync" id="syncStatus">وضعیت: آماده به کار</div>

    <div class="stats">
        <div class="stat-item">
            <label>سود هر کلیک</label>
            <span id="perClick">1</span>
        </div>
        <div class="stat-item">
            <label>سطح</label>
            <span id="level">1</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user 
            ? tg.initDataUnsafe.user 
            : { username: 'بازیکن' };

        const username = user.username || user.first_name || 'بازیکن';
        document.getElementById('usernameDisplay').innerText = `سلام، ${username}! 👋`;

        let score = parseInt(localStorage.getItem('game_score')) || 0;
        document.getElementById('score').innerText = score;

        function incrementScore(event) {
            score += 1;
            document.getElementById('score').innerText = score;
            localStorage.setItem('game_score', score);

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            showFloatingNumber(event);
        }

        function showFloatingNumber(event) {
            const coinBox = document.querySelector('.coin-box');
            const num = document.createElement('div');
            num.className = 'floating-num';
            num.innerText = '+1';
            
            const rect = coinBox.getBoundingClientRect();
            const x = event.clientX - rect.left - 20;
            const y = event.clientY - rect.top - 20;
            
            num.style.left = x + 'px';
            num.style.top = y + 'px';
            
            coinBox.appendChild(num);
            setTimeout(() => {
                num.remove();
            }, 600);
        }
    </script>
</body>
</html>
